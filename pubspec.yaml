name: clean_archi_frame
description: "Flutter Clean Architecture Framework v1.0.0"

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_settings:
  connectivity_plus:
  cupertino_back_gesture:
  cupertino_icons:
  dio:
  drift:
  flutter_riverpod:
  flutter_styled_toast:
  flutter_svg:
  freezed_annotation:
  geolocator:
  go_router:
  intl:
  json_annotation:
  logger:
  path:
  path_provider:
  permission_handler:
  riverpod_annotation:
  shared_preferences:
  slang:
  slang_flutter:
  sqlite3_flutter_libs: ^0.5.25
  url_launcher:
  firebase_core:
  firebase_messaging:
  flutter_local_notifications:
  firebase_remote_config:
  ota_update:
  package_info_plus:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  drift_dev:
  flutter_lints: ^6.0.0
  riverpod_generator:
  freezed:
  json_serializable:
  slang_build_runner:

# Assets Function
flutter:
  uses-material-design: true
