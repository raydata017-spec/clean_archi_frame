<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F4F7FB" rx="20"/>
  <ellipse cx="200" cy="240" rx="80" ry="12" fill="#E2E8F0"/>
  
  <!-- The Box Character (Sad/Empty) -->
  <g transform="translate(120, 110)">
    <!-- Inside Box -->
    <polygon points="20,0 120,0 100,50 0,50" fill="#B77B50"/>
    <!-- Front Box -->
    <polygon points="0,50 100,50 100,120 0,120" fill="#E09F67"/>
    <!-- Side Box -->
    <polygon points="100,50 120,0 120,70 100,120" fill="#C5854E"/>
    <!-- Left Flap -->
    <polygon points="0,50 -30,10 -10,-20 20,0" fill="#EFA96D"/>
    <!-- Right Flap -->
    <polygon points="100,50 130,10 110,-20 80,0" fill="#EFA96D"/>
    <!-- Back Flap -->
    <polygon points="20,0 30,-30 130,-30 120,0" fill="#C5854E"/>
    
    <!-- Sad Face -->
    <circle cx="35" cy="80" r="4" fill="#5A3A22"/>
    <circle cx="75" cy="80" r="4" fill="#5A3A22"/>
    <path d="M45,98 Q55,90 65,98" fill="none" stroke="#5A3A22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(250, 70) rotate(-15)">
    <!-- Glass border -->
    <circle cx="0" cy="0" r="22" fill="#F8FAFC" stroke="#334155" stroke-width="5"/>
    <circle cx="0" cy="0" r="22" fill="#60A5FA" opacity="0.1"/>
    <!-- Handle -->
    <line x1="15" y1="15" x2="38" y2="38" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <!-- Glass reflection -->
    <path d="M -8,-8 Q 5,-12 12,0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Dust / Empty marks -->
  <path d="M150,80 Q155,70 160,85" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M210,90 Q215,80 220,95" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M120,100 Q115,110 110,105" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
</svg>
