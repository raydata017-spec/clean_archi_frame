<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#FFF5F5" rx="20"/>
  <ellipse cx="200" cy="250" rx="100" ry="12" fill="#FED7D7"/>
  
  <!-- 404 Text Background -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="#FEB2B2" text-anchor="middle" opacity="0.5">404</text>
  
  <!-- The Box Character (Fallen over/ Error) -->
  <!-- Rotate 90 degrees to make it lie on its side -->
  <g transform="translate(130, 150) rotate(90, 50, 60)">
    <!-- Inside Box -->
    <polygon points="20,0 120,0 100,50 0,50" fill="#B77B50"/>
    <!-- Front Box -->
    <polygon points="0,50 100,50 100,120 0,120" fill="#E09F67"/>
    <!-- Side Box -->
    <polygon points="100,50 120,0 120,70 100,120" fill="#C5854E"/>
    <!-- Left Flap -->
    <polygon points="0,50 -30,10 -10,-20 20,0" fill="#EFA96D"/>
    <!-- Right Flap -->
    <polygon points="100,50 130,10 110,-20 80,0" fill="#EFA96D"/>
    <!-- Back Flap -->
    <polygon points="20,0 30,-30 130,-30 120,0" fill="#C5854E"/>
    
    <!-- Dizzy / Dead Face -->
    <g stroke="#5A3A22" stroke-width="2.5" stroke-linecap="round">
      <!-- Left X Eye -->
      <line x1="30" y1="75" x2="40" y2="85" />
      <line x1="40" y1="75" x2="30" y2="85" />
      <!-- Right X Eye -->
      <line x1="70" y1="75" x2="80" y2="85" />
      <line x1="80" y1="75" x2="70" y2="85" />
    </g>
    <!-- Wavy Dizzy Mouth -->
    <path d="M 45,98 Q 50,93 55,98 T 65,98" fill="none" stroke="#5A3A22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Error Exclamation mark floating -->
  <g transform="translate(260, 120)">
    <polygon points="-22,22 0,-20 22,22" fill="#FC8181" stroke="#E53E3E" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="-5" x2="0" y2="8" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="2.5" fill="#FFF"/>
  </g>

  <!-- Spilled/Scattered elements to show crash/error -->
  <circle cx="270" cy="245" r="4" fill="#FC8181"/>
  <rect x="235" y="240" width="8" height="8" fill="#CBD5E0" transform="rotate(20 235 240)"/>
  <path d="M 100,235 L 110,230 L 105,245 Z" fill="#F6AD55"/>
  <circle cx="120" cy="255" r="3" fill="#A0AEC0"/>
</svg>
